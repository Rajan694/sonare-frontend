name: CI

on:
  push:
    branches: [main, generic-branch]
  pull_request:

jobs:
  web:
    name: Desktop / web (desktop)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  mobile:
    name: Mobile (React Native)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  android-unit:
    name: Mobile native audio (JVM unit tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      # The React Native Gradle plugin needs node_modules.
      - run: npm ci
      - run: ./gradlew :app:testDebugUnitTest -PreactNativeArchitectures=x86_64
        working-directory: mobile/android

  # Telegram message when the run ends (success, failure or cancelled).
  # Reusable workflow + secrets: https://github.com/Rajan694/github-actions
  notify:
    name: Telegram Notification
    if: always()
    needs: [web, mobile, android-unit]
    uses: Rajan694/github-actions/.github/workflows/telegram-notify.yml@v1
    with:
      status: ${{ contains(needs.*.result, 'failure') && 'failure' || contains(needs.*.result, 'cancelled') && 'cancelled' || 'success' }}
      workflow_name: ${{ github.workflow }}
      repository: ${{ github.repository }}
      branch: ${{ github.head_ref || github.ref_name }}
      commit: ${{ github.event.pull_request.head.sha || github.sha }}
      run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      actor: ${{ github.actor }}
      is_deployment: false
    secrets:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
